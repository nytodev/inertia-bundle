services:

    _defaults:
        autowire: false
        autoconfigure: false

    # -------------------------------------------------------------------------
    # SSR Bundle Detector: resolves the path to the Node.js SSR bundle file.
    # Checks the configured ssr_bundle path first, then falls back to common
    # locations (bootstrap/ssr/ssr.mjs, public/build/ssr/ssr.mjs, etc.).
    # $ssrBundle and $projectDir are injected at compile time via loadExtension().
    # -------------------------------------------------------------------------
    inertia.ssr_bundle_detector:
        class: Nytodev\InertiaBundle\Ssr\BundleDetector
        public: false

    # -------------------------------------------------------------------------
    # SSR Gateway: NullSsrGateway by default (SSR disabled).
    # InertiaBundle::loadExtension() overrides this with HttpSsrGateway when
    # ssr_enabled: true, injecting the configured ssrUrl and related services.
    # -------------------------------------------------------------------------
    inertia.ssr_gateway:
        class: Nytodev\InertiaBundle\Ssr\NullSsrGateway
        public: false

    # -------------------------------------------------------------------------
    # SSR State: request-scoped cache for the SSR dispatch result.
    # Ensures the gateway is called at most once per request even when both
    # inertia() and inertiaHead() Twig functions are invoked.
    # Cleared between FrankenPHP/ReactPHP requests via kernel.reset.
    # -------------------------------------------------------------------------
    inertia.ssr_state:
        class: Nytodev\InertiaBundle\Ssr\SsrState
        public: false
        arguments:
            $gateway: '@inertia.ssr_gateway'
        tags:
            - { name: kernel.reset, method: reset }

    # -------------------------------------------------------------------------
    # Response builder: constructs the Inertia page object and returns
    # either an HTML response (first visit) or a JSON response (XHR visit).
    # -------------------------------------------------------------------------
    inertia.response:
        class: Nytodev\InertiaBundle\Response\InertiaResponse
        public: false
        arguments:
            $twig: '@twig'
            $normalizer: '@?serializer'

    # -------------------------------------------------------------------------
    # Core service: manages shared props and delegates to InertiaResponse.
    # Note: $rootView and $version are injected at compile time via
    # InertiaBundle::loadExtension() from the validated config.
    # -------------------------------------------------------------------------
    inertia.service:
        class: Nytodev\InertiaBundle\Service\Inertia
        public: false
        arguments:
            $requestStack: '@request_stack'
            $inertiaResponse: '@inertia.response'
        tags:
            - { name: kernel.reset, method: reset }

    # -------------------------------------------------------------------------
    # Event listener: kernel.request (version check → 409) +
    #                 kernel.response (302 → 303 conversion + once-prop flush)
    # -------------------------------------------------------------------------
    inertia.listener:
        class: Nytodev\InertiaBundle\EventListener\InertiaListener
        public: false
        arguments:
            $inertia: '@inertia.service'
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 20 }
            - { name: kernel.event_listener, event: kernel.response, method: onKernelResponse, priority: 0 }

    # -------------------------------------------------------------------------
    # Validation listener: kernel.exception — converts ValidationFailedException
    # (MapRequestPayload/MapQueryString or manual throw) into the Inertia error
    # flow: errors stored in session + 303 redirect back.
    # Requires symfony/validator; the definition is removed at compile time when
    # the component is absent (see InertiaBundle::loadExtension()).
    # Priority 16: must run before inertia.exception_listener.
    # -------------------------------------------------------------------------
    inertia.validation_listener:
        class: Nytodev\InertiaBundle\EventListener\InertiaValidationListener
        public: false
        arguments:
            $inertia: '@inertia.service'
        tags:
            - { name: kernel.event_listener, event: kernel.exception, method: onKernelException, priority: 16 }

    # -------------------------------------------------------------------------
    # Exception listener: kernel.exception — delegates to handleExceptionsUsing() callback.
    # -------------------------------------------------------------------------
    inertia.exception_listener:
        class: Nytodev\InertiaBundle\EventListener\InertiaExceptionListener
        public: false
        arguments:
            $inertia: '@inertia.service'
        tags:
            - { name: kernel.event_listener, event: kernel.exception, method: onKernelException, priority: 0 }

    # -------------------------------------------------------------------------
    # Twig extension: inertia(page) and inertiaHead(page) template functions.
    # Delegates dispatch caching to SsrState (reset via kernel.reset on SsrState).
    # -------------------------------------------------------------------------
    inertia.twig_extension:
        class: Nytodev\InertiaBundle\Twig\InertiaTwigExtension
        public: false
        arguments:
            $ssrState: '@inertia.ssr_state'
        tags:
            - { name: twig.extension }

    # -------------------------------------------------------------------------
    # Console commands: SSR server management.
    # Arguments are injected at compile time via InertiaBundle::loadExtension().
    # -------------------------------------------------------------------------
    inertia.command.start_ssr:
        class: Nytodev\InertiaBundle\Command\StartSsrCommand
        public: false
        arguments:
            $bundleDetector: '@inertia.ssr_bundle_detector'
        tags:
            - { name: console.command }

    inertia.command.stop_ssr:
        class: Nytodev\InertiaBundle\Command\StopSsrCommand
        public: false
        tags:
            - { name: console.command }

    inertia.command.check_ssr:
        class: Nytodev\InertiaBundle\Command\CheckSsrCommand
        public: false
        tags:
            - { name: console.command }

    # =========================================================================
    # Public aliases for autowiring — inject the FQCN type-hint in controllers
    # =========================================================================
    Nytodev\InertiaBundle\Service\Inertia:
        alias: inertia.service
        public: true
