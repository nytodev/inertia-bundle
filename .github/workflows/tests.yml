name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  COMPOSER_NO_INTERACTION: 1

jobs:
  tests:
    name: "PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }} (${{ matrix.stability }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
        symfony: ["6.4", "7.4", "8.0"]
        stability: ["prefer-lowest", "prefer-stable"]
        exclude:
          # Symfony 7.x requires PHP >= 8.2
          - php: "8.1"
            symfony: "7.4"
          # Symfony 8.x requires PHP >= 8.4
          - php: "8.1"
            symfony: "8.0"
          - php: "8.2"
            symfony: "8.0"
          - php: "8.3"
            symfony: "8.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, iconv
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Constrain Symfony version
        run: |
          composer require --no-update \
            "symfony/config:${{ matrix.symfony }}.*" \
            "symfony/console:${{ matrix.symfony }}.*" \
            "symfony/dependency-injection:${{ matrix.symfony }}.*" \
            "symfony/framework-bundle:${{ matrix.symfony }}.*" \
            "symfony/http-foundation:${{ matrix.symfony }}.*" \
            "symfony/http-kernel:${{ matrix.symfony }}.*" \
            "symfony/process:${{ matrix.symfony }}.*" \
            "symfony/twig-bridge:${{ matrix.symfony }}.*" \
            "symfony/twig-bundle:${{ matrix.symfony }}.*"
          composer require --dev --no-update \
            "symfony/browser-kit:${{ matrix.symfony }}.*" \
            "symfony/http-client:${{ matrix.symfony }}.*" \
            "symfony/property-access:${{ matrix.symfony }}.*" \
            "symfony/serializer:${{ matrix.symfony }}.*" \
            "symfony/validator:${{ matrix.symfony }}.*" \
            "symfony/yaml:${{ matrix.symfony }}.*"

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer update --${{ matrix.stability }} --no-interaction

      - name: PHPStan (src/)
        run: vendor/bin/phpstan analyse src/ --level=8 --no-progress

      - name: PHP CS Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --no-interaction
        env:
          PHP_CS_FIXER_IGNORE_ENV: 1

      - name: PHPUnit
        run: vendor/bin/phpunit --no-coverage

  coverage:
    name: "Coverage (PHP 8.4 / Symfony 8.0)"
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP 8.4 with Xdebug
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: xdebug

      - name: Constrain Symfony version
        run: |
          composer require --no-update \
            "symfony/config:8.0.*" \
            "symfony/console:8.0.*" \
            "symfony/dependency-injection:8.0.*" \
            "symfony/framework-bundle:8.0.*" \
            "symfony/http-foundation:8.0.*" \
            "symfony/http-kernel:8.0.*" \
            "symfony/process:8.0.*" \
            "symfony/twig-bridge:8.0.*" \
            "symfony/twig-bundle:8.0.*"
          composer require --dev --no-update \
            "symfony/browser-kit:8.0.*" \
            "symfony/http-client:8.0.*" \
            "symfony/property-access:8.0.*" \
            "symfony/serializer:8.0.*" \
            "symfony/validator:8.0.*" \
            "symfony/yaml:8.0.*"

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer update --prefer-stable --no-interaction

      - name: PHPUnit with coverage
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage/clover.xml

      - name: Enforce 95% minimum coverage
        run: |
          COVERAGE=$(php -r "
            \$xml = simplexml_load_file('coverage/clover.xml');
            \$metrics = \$xml->xpath('//metrics');
            \$total = 0; \$covered = 0;
            foreach (\$metrics as \$m) {
              \$total   += (int) \$m['elements'];
              \$covered += (int) \$m['coveredelements'];
            }
            echo \$total > 0 ? round((\$covered / \$total) * 100, 2) : 0;
          ")
          echo "Coverage: ${COVERAGE}%"
          if (( $(echo "${COVERAGE} < 95" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below the required 95%" && exit 1
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
